<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaiendCare | Deactivate Account</title>
</head>
<body>
    <div class="page delete-page">
        <section>
            <a href="privacy.html" class="nav-link">&larr; Back to Privacy Center</a>
            <h1 class="page-title">Deactivate your account</h1>
            <p class="page-subtitle">
                This form starts the deletion workflow. We will verify your identity, remove app access, and schedule secure data destruction as per POPIA.
            </p>
            <form class="page-form">
                <div class="form-group">
                    <label for="fullName">Full name</label>
                    <input id="fullName" name="fullName" type="text" placeholder="Jane Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email on account</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="reason">Reason for leaving (optional)</label>
                    <textarea id="reason" name="reason" placeholder="Provide context so we can close the loop."></textarea>
                </div>
                <div class="form-group form-group--inline">
                    <input id="confirm" name="confirm" type="checkbox" required>
                    <label for="confirm">I understand this action permanently deletes my account.</label>
                </div>
                <div class="actions">
                    <button class="btn btn-secondary" type="reset">Reset Form</button>
                    <button class="btn btn-danger" type="submit">Submit Deactivation Request</button>
                </div>
            </form>
            <p class="metadata form-footer">
                Need help first? Email <a class="nav-link" href="mailto:support@kaienedcare.co.za">support@kaienedcare.co.za</a>.
            </p>
        </section>
    </div>
    <script type="module" src="/src/pages/delete-account.ts"></script>
</body>
</html>
